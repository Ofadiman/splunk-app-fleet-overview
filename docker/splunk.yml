splunk:
  conf:
    - key: server
      value:
        content:
          general:
            sessionTimeout: 365d
          deployment:
            pass4SymmKey: fleet-overview-deployment-key
    - key: web
      value:
        content:
          settings:
            tools.sessions.timeout: "525600"
            ui_inactivity_timeout: "0"
            use_future_expires: "false"
            replyHeader.Cache-Control: no-store
            cacheEntriesLimit: "0"
            enable_insecure_login: "true"
            updateCheckerBaseURL: "0"
    - key: telemetry
      value:
        directory: /opt/splunk/etc/apps/splunk_instrumentation/local
        content:
          general:
            sendAnonymizedUsage: "false"
            sendLicenseUsage: "false"
            sendAnonymizedWebAnalytics: "false"
            optInVersionAcknowledged: "4"
    - key: ui-tour
      value:
        content:
          search-tour:
            viewed: "1"
    - key: user-prefs
      value:
        content:
          general:
            hideInstrumentationOptInModal: "1"
    - key: restmap
      value:
        content:
          broker:broker:
            authKeyStanza: deployment
            requireAuthentication: "true"
          streams:deployment:
            authKeyStanza: deployment
            requireAuthentication: "true"

splunk:
  conf:
    - key: server
      value:
        content:
          general:
            sessionTimeout: 365d
          deployment:
            pass4SymmKey: fleet-overview-deployment-key
    - key: web
      value:
        content:
          settings:
            tools.sessions.timeout: "525600"
            ui_inactivity_timeout: "0"
    - key: restmap
      value:
        content:
          broker:broker:
            authKeyStanza: deployment
            requireAuthentication: "true"
          streams:deployment:
            authKeyStanza: deployment
            requireAuthentication: "true"

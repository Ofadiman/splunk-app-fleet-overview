name: ci

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    actionlint:
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@v5.3.0
              with:
                  version: 2026.11.2
                  install_args: actionlint
            - name: Check workflow syntax
              run: actionlint

    prettier:
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@v5.3.0
              with:
                  version: 2026.11.2
                  install_args: node pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  CYPRESS_INSTALL_BINARY: '0'
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            - name: Check formatting
              run: pnpm format:verify

    typescript:
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@v5.3.0
              with:
                  version: 2026.11.2
                  install_args: node pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  CYPRESS_INSTALL_BINARY: '0'
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            - name: Check TypeScript
              run: pnpm typescript:check

    vitest:
        name: Vitest (${{ matrix.browser }})
        runs-on: macos-26
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                browser: [chrome, edge, firefox, webkit]
        env:
            BROWSER: ${{ matrix.browser }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@v5.3.0
              with:
                  version: 2026.11.2
                  install_args: node pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  CYPRESS_INSTALL_BINARY: '0'
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            - name: Install the Playwright browser
              if: matrix.browser == 'firefox' || matrix.browser == 'webkit'
              run: pnpm exec playwright install "$BROWSER"
            - name: Run Vitest
              run: pnpm "test:vitest:$BROWSER"
            - name: Upload failure screenshots
              if: failure()
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: vitest-${{ matrix.browser }}-failures
                  path: dist/test-attachments
                  if-no-files-found: ignore
                  overwrite: true

    cypress:
        name: Cypress (${{ matrix.browser }})
        runs-on: macos-26
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                browser: [chrome, edge, firefox, webkit]
        env:
            BROWSER: ${{ matrix.browser }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@v5.3.0
              with:
                  version: 2026.11.2
                  install_args: node pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ${{ matrix.browser != 'webkit' && '1' || '0' }}
            - name: Run Cypress
              run: pnpm "test:cypress:$BROWSER"
            - name: Upload failure screenshots
              if: failure()
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: cypress-${{ matrix.browser }}-failures
                  path: dist/cypress/screenshots
                  if-no-files-found: ignore
                  overwrite: true

    cypress-e2e:
        name: Cypress E2E (${{ matrix.browser }})
        runs-on: ubuntu-26.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                browser: [chrome, edge, firefox, webkit]
        env:
            BROWSER: ${{ matrix.browser }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@v5.3.0
              with:
                  version: 2026.11.2
                  install_args: node pnpm
            - name: Install Cypress system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends \
                      libgtk-3-0t64 libgbm-dev libnotify-dev libnss3 libxss1 \
                      libasound2t64 libxtst6 xauth xvfb
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ${{ matrix.browser != 'webkit' && '1' || '0' }}
            - name: Install Cypress WebKit system dependencies
              if: matrix.browser == 'webkit'
              run: node node_modules/playwright-webkit/cli.js install-deps webkit
            - name: Build the Splunk app
              run: pnpm build
            - name: Start Splunk
              run: docker compose up --build --detach --wait --wait-timeout 300 splunk
            - name: Run Cypress E2E
              run: pnpm "test:cypress:e2e:$BROWSER"
            - name: Collect Splunk logs
              if: failure()
              run: |
                  if [ ! -f compose.yaml ] || [ -z "$(docker compose ps --all --services splunk)" ]; then
                      exit 0
                  fi

                  mkdir --parents dist/splunk-logs
                  docker compose logs --no-color --timestamps splunk > dist/splunk-logs/console.log 2>&1
                  tail --lines 100 dist/splunk-logs/console.log
                  docker compose cp splunk:/opt/splunk/var/log - > dist/splunk-logs/files.tar
            - name: Upload Splunk logs
              if: failure()
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: cypress-e2e-${{ matrix.browser }}-splunk-logs
                  path: dist/splunk-logs
                  if-no-files-found: ignore
                  overwrite: true
            - name: Upload failure screenshots
              if: failure()
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: cypress-e2e-${{ matrix.browser }}-failures
                  path: dist/cypress/e2e/screenshots
                  if-no-files-found: ignore
                  overwrite: true

    playwright-e2e:
        name: Playwright E2E (${{ matrix.browser }})
        runs-on: ubuntu-26.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                browser: [chrome, edge, firefox, webkit]
        env:
            BROWSER: ${{ matrix.browser }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@v5.3.0
              with:
                  version: 2026.11.2
                  install_args: node pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  CYPRESS_INSTALL_BINARY: '0'
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            - name: Install the Playwright browser and system dependencies
              if: matrix.browser == 'firefox' || matrix.browser == 'webkit'
              run: pnpm exec playwright install --with-deps "$BROWSER"
            - name: Build the Splunk app
              run: pnpm build
            - name: Start Splunk
              run: docker compose up --build --detach --wait --wait-timeout 300 splunk
            - name: Run Playwright E2E
              run: pnpm "test:playwright:e2e:$BROWSER"
            - name: Collect Splunk logs
              if: failure()
              run: |
                  if [ ! -f compose.yaml ] || [ -z "$(docker compose ps --all --services splunk)" ]; then
                      exit 0
                  fi

                  mkdir --parents dist/splunk-logs
                  docker compose logs --no-color --timestamps splunk > dist/splunk-logs/console.log 2>&1
                  tail --lines 100 dist/splunk-logs/console.log
                  docker compose cp splunk:/opt/splunk/var/log - > dist/splunk-logs/files.tar
            - name: Upload Splunk logs
              if: failure()
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: playwright-e2e-${{ matrix.browser }}-splunk-logs
                  path: dist/splunk-logs
                  if-no-files-found: ignore
                  overwrite: true
            - name: Upload failure traces
              if: failure()
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: playwright-e2e-${{ matrix.browser }}-failures
                  path: dist/playwright
                  if-no-files-found: ignore
                  overwrite: true

    appinspect:
        runs-on: macos-26
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@v5.3.0
              with:
                  version: 2026.11.2
                  cache: ${{ github.ref_type != 'tag' }}
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  CYPRESS_INSTALL_BINARY: '0'
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            - name: Build the Splunk package and run AppInspect
              run: mise run appinspect
            - name: Upload the validated Splunk package
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: fleet-overview-package
                  path: dist/fleet_overview.tar.gz
                  if-no-files-found: error
                  overwrite: true

    release:
        if: github.event_name == 'push' && github.ref_type == 'tag'
        needs:
            - actionlint
            - prettier
            - typescript
            - vitest
            - cypress
            - cypress-e2e
            - playwright-e2e
            - appinspect
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - name: Download the validated Splunk package
              uses: actions/download-artifact@v8.0.2
              with:
                  name: fleet-overview-package
            - name: Publish the Splunk package
              run: gh release create "$RELEASE_TAG" fleet_overview.tar.gz --verify-tag --generate-notes
              env:
                  GH_REPO: ${{ github.repository }}
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}

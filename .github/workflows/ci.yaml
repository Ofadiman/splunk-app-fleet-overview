name: ci

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    actionlint:
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@v5.3.0
              with:
                  version: 2026.11.2
                  install_args: actionlint
            - name: Check workflow syntax
              run: actionlint

    prettier:
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@v5.3.0
              with:
                  version: 2026.11.2
                  install_args: node pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  CYPRESS_INSTALL_BINARY: '0'
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            - name: Check formatting
              run: pnpm format:verify

    typescript:
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@v5.3.0
              with:
                  version: 2026.11.2
                  install_args: node pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  CYPRESS_INSTALL_BINARY: '0'
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            - name: Check TypeScript
              run: pnpm typescript:check

    vitest:
        name: Vitest (${{ matrix.browser }})
        runs-on: macos-26
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                browser: [chrome, edge, firefox, webkit]
        env:
            BROWSER: ${{ matrix.browser }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@v5.3.0
              with:
                  version: 2026.11.2
                  install_args: node pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  CYPRESS_INSTALL_BINARY: '0'
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            - name: Install the Playwright browser
              if: matrix.browser == 'firefox' || matrix.browser == 'webkit'
              run: pnpm exec playwright install "$BROWSER"
            - name: Run Vitest
              run: pnpm "test:vitest:$BROWSER"
            - name: Upload failure screenshots
              if: failure()
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: vitest-${{ matrix.browser }}-failures
                  path: dist/test-attachments
                  if-no-files-found: ignore
                  overwrite: true

    cypress:
        name: Cypress (${{ matrix.browser }})
        runs-on: macos-26
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                browser: [chrome, edge, firefox, webkit]
        env:
            BROWSER: ${{ matrix.browser }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@v5.3.0
              with:
                  version: 2026.11.2
                  install_args: node pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ${{ matrix.browser != 'webkit' && '1' || '0' }}
            - name: Run Cypress
              run: pnpm "test:cypress:$BROWSER"
            - name: Upload failure screenshots
              if: failure()
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: cypress-${{ matrix.browser }}-failures
                  path: dist/cypress/screenshots
                  if-no-files-found: ignore
                  overwrite: true

    appinspect:
        runs-on: macos-26
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@v5.3.0
              with:
                  version: 2026.11.2
                  cache: ${{ github.ref_type != 'tag' }}
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  CYPRESS_INSTALL_BINARY: '0'
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            - name: Build the Splunk package and run AppInspect
              run: mise run appinspect
            - name: Upload the validated Splunk package
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: fleet-overview-package
                  path: dist/fleet_overview.tar.gz
                  if-no-files-found: error
                  overwrite: true

    release:
        if: github.event_name == 'push' && github.ref_type == 'tag'
        needs: [actionlint, prettier, typescript, vitest, cypress, appinspect]
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - name: Download the validated Splunk package
              uses: actions/download-artifact@v8.0.2
              with:
                  name: fleet-overview-package
            - name: Publish the Splunk package
              run: gh release create "$RELEASE_TAG" fleet_overview.tar.gz --verify-tag --generate-notes
              env:
                  GH_REPO: ${{ github.repository }}
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
